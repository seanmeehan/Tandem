<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tandem</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main id="board">
    <section class="player rotated" id="player-a">
      <div class="player-head">
        <span class="player-label">Player A</span>
        <button id="bass-toggle" class="view-toggle" type="button">🎸 Bass</button>
      </div>
      <div class="grid" data-player="a"></div>
      <div class="grid bass-grid" id="bass-grid" hidden></div>
      <div class="controls melody-controls">
        <label>Filter <input class="knob" type="range" min="100" max="8000" step="10" value="2000" data-param="filter"></label>
        <label>Res <input class="knob" type="range" min="0.5" max="15" step="0.1" value="1.5" data-param="res"></label>
        <label>Env <input class="knob" type="range" min="0" max="1" step="0.01" value="0" data-param="env"></label>
        <label>Rate
          <select class="wave" data-param="envRate">
            <option value="4m">4m</option>
            <option value="2m" selected>2m</option>
            <option value="1m">1m</option>
            <option value="2n">½</option>
            <option value="4n">¼</option>
          </select>
        </label>
        <label>Decay <input class="knob" type="range" min="0.02" max="1.5" step="0.01" value="0.25" data-param="decay"></label>
        <label>Wave
          <select class="wave" data-param="wave">
            <option value="sawtooth" selected>Saw</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sine">Sine</option>
          </select>
        </label>
        <label>Mode
          <select class="wave" data-param="mode">
            <option value="pluck" selected>Pluck</option>
            <option value="sustain">Sustain</option>
          </select>
        </label>
        <button class="toggle" data-param="glide">Glide</button>
        <button class="toggle" data-param="crush">Crush</button>
        <select class="wave" data-param="crushType" aria-label="Distortion type">
          <option value="crush" selected>Bit</option>
          <option value="drive">Drive</option>
          <option value="fuzz">Fuzz</option>
        </select>
        <label>Vol <input class="knob" type="range" min="-30" max="0" step="0.1" value="-10" data-param="vol"></label>
        <button class="randomize" data-action="randomize" title="Randomize sound" aria-label="Randomize sound">🎲</button>
      </div>
      <div class="controls companion-controls bass-controls" hidden>
        <label>Mode
          <select class="bass-knob" data-param="mode">
            <option value="pluck" selected>Pluck</option>
            <option value="sustain">Sustain</option>
          </select>
        </label>
        <label>Cutoff <input class="bass-knob" type="range" min="100" max="2000" step="10" value="700" data-param="filter"></label>
        <label>Mod <input class="bass-knob" type="range" min="0" max="1" step="0.01" value="0" data-param="mod"></label>
        <label>Rate
          <select class="bass-knob" data-param="modRate">
            <option value="4m">4m</option>
            <option value="2m" selected>2m</option>
            <option value="1m">1m</option>
            <option value="2n">½</option>
            <option value="4n">¼</option>
          </select>
        </label>
        <label>Vol <input class="bass-knob" type="range" min="-30" max="0" step="0.1" value="-8" data-param="vol"></label>
        <button id="bass-clear" type="button" class="companion-clear">Clear</button>
      </div>
    </section>

    <section id="transport">
      <div class="solo-tabs" id="solo-tabs">
        <button class="solo-tab on" data-solo-view="melody" type="button">Melody</button>
        <button class="solo-tab" data-solo-view="bass" type="button">Bass</button>
        <button class="solo-tab" data-solo-view="drums" type="button">Drums</button>
      </div>
      <button id="play" class="primary">▶ Play</button>
      <button id="record">● Record</button>
      <label>Tempo
        <input id="tempo" type="range" min="60" max="180" step="1" value="110">
        <span id="tempo-display">110</span>
      </label>
      <label>Swing
        <input id="swing" type="range" min="0" max="0.66" step="0.01" value="0">
        <span id="swing-display">0%</span>
      </label>
      <label>Steps
        <select id="steps-count">
          <option value="8" selected>8</option>
          <option value="16">16</option>
          <option value="24">24</option>
          <option value="32">32</option>
        </select>
      </label>
      <span id="status">stopped</span>
    </section>

    <section class="player" id="player-b">
      <div class="player-head">
        <span class="player-label">Player B</span>
        <button id="drum-toggle" class="view-toggle" type="button">🥁 Drums</button>
      </div>
      <div class="grid" data-player="b"></div>
      <div class="grid drum-grid" id="drum-grid" hidden></div>
      <div class="controls melody-controls">
        <label>Filter <input class="knob" type="range" min="100" max="8000" step="10" value="2000" data-param="filter"></label>
        <label>Res <input class="knob" type="range" min="0.5" max="15" step="0.1" value="1.5" data-param="res"></label>
        <label>Env <input class="knob" type="range" min="0" max="1" step="0.01" value="0" data-param="env"></label>
        <label>Rate
          <select class="wave" data-param="envRate">
            <option value="4m">4m</option>
            <option value="2m" selected>2m</option>
            <option value="1m">1m</option>
            <option value="2n">½</option>
            <option value="4n">¼</option>
          </select>
        </label>
        <label>Decay <input class="knob" type="range" min="0.02" max="1.5" step="0.01" value="0.25" data-param="decay"></label>
        <label>Wave
          <select class="wave" data-param="wave">
            <option value="sawtooth" selected>Saw</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sine">Sine</option>
          </select>
        </label>
        <label>Mode
          <select class="wave" data-param="mode">
            <option value="pluck" selected>Pluck</option>
            <option value="sustain">Sustain</option>
          </select>
        </label>
        <button class="toggle" data-param="glide">Glide</button>
        <button class="toggle" data-param="crush">Crush</button>
        <select class="wave" data-param="crushType" aria-label="Distortion type">
          <option value="crush" selected>Bit</option>
          <option value="drive">Drive</option>
          <option value="fuzz">Fuzz</option>
        </select>
        <label>Vol <input class="knob" type="range" min="-30" max="0" step="0.1" value="-10" data-param="vol"></label>
        <button class="randomize" data-action="randomize" title="Randomize sound" aria-label="Randomize sound">🎲</button>
      </div>
      <div class="controls companion-controls drum-controls" hidden>
        <label>Vol <input class="drum-knob" type="range" min="-30" max="0" step="0.1" value="-8"></label>
        <button id="drum-clear" type="button" class="companion-clear">Clear</button>
      </div>
    </section>
  </main>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
