<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tandem</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main id="board">
    <section class="player rotated" id="player-a">
      <div class="player-head">
        <span class="player-label">Player A</span>
      </div>
      <div class="grid" data-player="a"></div>
      <div class="controls">
        <label>Filter <input class="knob" type="range" min="100" max="8000" step="10" value="2000" data-param="filter"></label>
        <label>Res <input class="knob" type="range" min="0.5" max="15" step="0.1" value="1.5" data-param="res"></label>
        <label>Decay <input class="knob" type="range" min="0.02" max="1.5" step="0.01" value="0.25" data-param="decay"></label>
        <label>Wave
          <select class="wave" data-param="wave">
            <option value="sawtooth" selected>Saw</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sine">Sine</option>
          </select>
        </label>
        <button class="toggle" data-param="glide">Glide</button>
        <button class="toggle" data-param="crush">Crush</button>
        <label>Vol <input class="knob" type="range" min="-30" max="0" step="0.1" value="-10" data-param="vol"></label>
      </div>
    </section>

    <section id="transport">
      <button id="play" class="primary">▶ Play</button>
      <button id="record">● Record</button>
      <label>Tempo
        <input id="tempo" type="range" min="60" max="180" step="1" value="110">
        <span id="tempo-display">110</span>
      </label>
      <label>Swing
        <input id="swing" type="range" min="0" max="0.66" step="0.01" value="0">
        <span id="swing-display">0%</span>
      </label>
      <span id="status">stopped</span>
    </section>

    <section class="player" id="player-b">
      <div class="player-head">
        <span class="player-label">Player B</span>
      </div>
      <div class="grid" data-player="b"></div>
      <div class="controls">
        <label>Filter <input class="knob" type="range" min="100" max="8000" step="10" value="2000" data-param="filter"></label>
        <label>Res <input class="knob" type="range" min="0.5" max="15" step="0.1" value="1.5" data-param="res"></label>
        <label>Decay <input class="knob" type="range" min="0.02" max="1.5" step="0.01" value="0.25" data-param="decay"></label>
        <label>Wave
          <select class="wave" data-param="wave">
            <option value="sawtooth" selected>Saw</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sine">Sine</option>
          </select>
        </label>
        <button class="toggle" data-param="glide">Glide</button>
        <button class="toggle" data-param="crush">Crush</button>
        <label>Vol <input class="knob" type="range" min="-30" max="0" step="0.1" value="-10" data-param="vol"></label>
      </div>
    </section>
  </main>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
